<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Md Mohasin Hossain, AI Researcher and Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#10264f"/>
      <stop offset="1" stop-color="#0e6f8f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" rx="14" fill="url(#bg)"/>

  <!-- concept-graph motif -->
  <g stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="820" y1="60" x2="920" y2="120"/>
    <line x1="920" y1="120" x2="1010" y2="70"/>
    <line x1="920" y1="120" x2="980" y2="190"/>
    <line x1="1010" y1="70" x2="1100" y2="130"/>
    <line x1="980" y1="190" x2="1100" y2="130"/>
    <line x1="820" y1="60" x2="880" y2="200"/>
    <line x1="880" y1="200" x2="980" y2="190"/>
    <line x1="1010" y1="70" x2="1080" y2="30"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="820" cy="60" r="7" fill-opacity="0.9"/>
    <circle cx="920" cy="120" r="11"/>
    <circle cx="1010" cy="70" r="8" fill-opacity="0.85"/>
    <circle cx="980" cy="190" r="7" fill-opacity="0.7"/>
    <circle cx="1100" cy="130" r="10" fill-opacity="0.9"/>
    <circle cx="880" cy="200" r="5" fill-opacity="0.6"/>
    <circle cx="1080" cy="30" r="5" fill-opacity="0.6"/>
  </g>

  <text x="64" y="108" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="0.5">Md Mohasin Hossain</text>
  <rect x="66" y="128" width="72" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="172" fill="#e2e8f0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500">AI Researcher &amp; Engineer</text>
  <text x="64" y="204" fill="#93c5fd" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" letter-spacing="0.4">Deep Learning  |  Explainable AI  |  LLM Systems  |  Computational Science</text>
</svg>
